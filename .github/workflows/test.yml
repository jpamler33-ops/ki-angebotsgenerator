name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run quotation regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile app and engine
        run: python -m compileall -q app.py offer_engine.py
